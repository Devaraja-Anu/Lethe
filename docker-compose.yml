services:
  postgres:
    image: postgres:16-alpine
    container_name: lethe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lethe_test
      POSTGRES_USER: lethe
      POSTGRES_PASSWORD: lethe_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lethe -d lethe_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
